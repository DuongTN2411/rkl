<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>
  <body
    class="bg-gray-100 dark:bg-slate-900 p-8 min-h-screen transition-colors duration-300"
  >
    <div class="flex justify-center items-center min-h-[70vh]">
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 w-72 text-center"
      >
        <h3 class="font-bold text-gray-800 dark:text-white">Tour Đà Lạt</h3>
        <p class="text-gray-400 dark:text-gray-400 text-xs mb-2">
          3 Ngày 2 Đêm
        </p>
        <p class="text-blue-600 dark:text-blue-400 text-2xl font-bold mb-3">
          2.500.000đ
          <span class="text-xs font-normal text-gray-400">/khách</span>
        </p>
        <ul class="text-gray-600 dark:text-gray-300 text-sm space-y-1 mb-4">
          <li>Khách sạn 4 sao trung tâm</li>
          <li>Xe Limousine đưa đón tận nơi</li>
          <li>Vé tham quan tất cả các điểm</li>
        </ul>
        <button
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg"
        >
          ĐẶT TOUR NGAY
        </button>
      </div>
    </div>

    <button
      onclick="document.documentElement.classList.toggle('dark')"
      class="fixed bottom-6 right-6 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-white text-sm px-4 py-2 rounded-full shadow"
    >
      Đổi Giao Diện
    </button>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 10</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex min-h-screen">
      <aside
        class="hidden md:flex md:flex-col w-56 bg-slate-900 text-gray-300 p-4"
      >
        <h1 class="text-white font-bold mb-6">TechGadget Admin</h1>
        <nav class="flex flex-col gap-3 text-sm">
          <a href="#" class="bg-blue-700 text-white px-3 py-2 rounded-lg"
            >Tổng quan</a
          >
          <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-800"
            >Đơn hàng</a
          >
          <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-800"
            >Sản phẩm</a
          >
          <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-800"
            >Khách hàng</a
          >
        </nav>
      </aside>

      <main class="flex-1 p-6">
        <input
          type="text"
          placeholder="Tìm kiếm mã đơn hàng, sản phẩm..."
          class="w-full mb-6 px-4 py-2 border border-gray-300 rounded-lg text-sm"
        />

        <h2 class="text-lg font-bold mb-4">Tổng quan hệ thống</h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-white rounded-xl shadow p-4">
            <p class="text-gray-400 text-xs mb-1">Tổng doanh thu</p>
            <p class="font-bold text-gray-800">125.000.000 đ</p>
          </div>

          <div class="bg-white rounded-xl shadow p-4">
            <p class="text-gray-400 text-xs mb-1">Đơn hàng mới</p>
            <p class="font-bold text-gray-800">342</p>
          </div>

          <div class="bg-white rounded-xl shadow p-4">
            <p class="text-gray-400 text-xs mb-1">Khách hàng truy cập</p>
            <p class="font-bold text-gray-800">1,204</p>
          </div>

          <div class="bg-white rounded-xl shadow p-4">
            <p class="text-gray-400 text-xs mb-1">Tỉ lệ chuyển đổi</p>
            <p class="font-bold text-gray-800">4.5%</p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table 2</title>
  </head>
  <body>
    <table style="border: 1px solid">
      <thead>
        <th class="table-head" style="border: 1px solid">Monday</th>
        <th class="table-head">Tuesday</th>
        <th class="table-head">Wednesday</th>
      </thead>
      <tbody>
        <tr class="table-row" style="border: 1px solid">
          <td class="table-detail" rowspan="2" style="border: 1px solid">
            300
          </td>
          <td class="table-detail">200</td>
          <td class="table-detail">100</td>
        </tr>
        <tr class="table-row" style="border: 1px solid">
          <td class="table-detail">300</td>
          <td class="table-detail">200</td>
        </tr>
        <tr class="table-row" style="border: 1px solid">
          <td class="table-detail" colspan="3" style="border: 1px solid">
            100
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>

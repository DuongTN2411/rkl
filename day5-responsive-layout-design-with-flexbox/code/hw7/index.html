<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 7</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="pricing-wrapper">
      <div class="pricing-container">
        <div class="plan">
          <p class="plan-label">Cơ bản</p>
          <h2>Miễn phí</h2>
          <ul>
            <li>1 Dự án</li>
            <li>100MB Lưu trữ</li>
            <li>Hỗ trợ Email</li>
          </ul>
          <button class="btn-dark">Bắt đầu ngay</button>
        </div>

        <div class="plan highlight">
          <p class="plan-label">Chuyên nghiệp</p>
          <h2>99.000đ/th</h2>
          <ul>
            <li>Dự án Không Giới Hạn</li>
            <li>10GB Lưu trữ</li>
            <li>Hỗ trợ 24/7</li>
            <li>Domain Tuỳ chỉnh</li>
          </ul>
          <button class="btn-white">Nâng Cấp</button>
        </div>

        <div class="plan">
          <p class="plan-label">Doanh nghiệp</p>
          <h2>Liên hệ</h2>
          <ul>
            <li>Gói tuỳ chọn đầy đủ</li>
            <li>Dung lượng cao nhất</li>
            <li>Tư vấn riêng biệt</li>
          </ul>
          <button class="btn-dark">Tìm hiểu thêm</button>
        </div>
      </div>
    </div>
  </body>
</html>

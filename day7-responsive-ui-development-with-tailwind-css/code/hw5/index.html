<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <div class="bg-white rounded-xl shadow p-6 max-w-3xl mx-auto">
      <h2 class="text-xl font-bold mb-4 text-center">Các Tour Nổi Bật</h2>

      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <img
            src="./hw5-1.png"
            alt="Thái Lan"
            class="w-full h-32 object-cover"
          />
          <div class="p-3 text-center">
            <h3 class="font-bold text-gray-800 text-sm">Thái Lan</h3>
            <p class="text-gray-500 text-xs">Xứ sở chùa vàng</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
          <img
            src="./hw5-2.png"
            alt="Nhật Bản"
            class="w-full h-32 object-cover"
          />
          <div class="p-3 text-center">
            <h3 class="font-bold text-gray-800 text-sm">Nhật Bản</h3>
            <p class="text-gray-500 text-xs">Hoa anh đào rực rỡ</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
          <img src="./hw5-3.png" alt="Pháp" class="w-full h-32 object-cover" />
          <div class="p-3 text-center">
            <h3 class="font-bold text-gray-800 text-sm">Pháp</h3>
            <p class="text-gray-500 text-xs">Kinh đô ánh sáng</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

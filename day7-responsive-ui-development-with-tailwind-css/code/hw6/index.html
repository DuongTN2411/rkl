<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8 flex justify-center">
    <form class="bg-white rounded-xl shadow p-6 w-full max-w-3xl space-y-4">
      <div class="flex flex-col md:flex-row md:items-end gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Điểm đến</label
          >
          <input
            type="text"
            placeholder="Bạn muốn đi đâu?"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm"
          />
        </div>

        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Ngày đi</label
          >
          <input
            type="date"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm"
          />
        </div>

        <button
          type="submit"
          class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg"
        >
          Tìm kiếm
        </button>
      </div>
    </form>
  </body>
</html>

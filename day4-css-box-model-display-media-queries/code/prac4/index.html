<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Practice 4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p class="label">
      Hàng 1 — ẩn khối giữa bằng <code>display: none</code> (xóa hoàn toàn khỏi
      layout)
    </p>
    <div class="row">
      <div class="box green">Sản phẩm 1</div>
      <div class="box green hidden-display">Sản phẩm 2</div>
      <div class="box purple">Sản phẩm 3</div>
    </div>

    <p class="label">
      Hàng 2 — ẩn khối giữa bằng <code>visibility: hidden</code> (giữ nguyên chỗ
      trống)
    </p>
    <div class="row">
      <div class="box green">Sản phẩm 4</div>
      <div class="box green hidden-visibility">Sản phẩm 5</div>
      <div class="box purple">Sản phẩm 6</div>
    </div>
  </body>
</html>
